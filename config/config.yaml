# Hermes Agent Configuration
# Deploy to: /mnt/workspace/hermes/config.yaml
# Secrets are referenced via environment variables from the .env file.

# Model configuration (used by the TUI chat and dashboard)
# Three-tier model strategy:
#   reasoning: deep multi-step logic, math, complex planning
#   coding:    general purpose, code generation, tool use
#   chat:      fast conversational responses, email drafting
model:
  reasoning: "deepseek/deepseek-r1-0528"
  coding: "deepseek/deepseek-v4-flash"
  chat: "google/gemini-2.5-flash-lite"
  default: "deepseek/deepseek-v4-flash"
  provider: "openrouter"

agent:
  name: "hermes"
  llm_provider: "openrouter"
  model: "deepseek/deepseek-v4-flash"
  reasoning_model: "deepseek/deepseek-r1-0528"
  chat_model: "google/gemini-2.5-flash-lite"
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"

api_server:
  enabled: true
  port: 8081
  api_key: "${HERMES_API_KEY}"

platforms:
  webhook:
    enabled: true
    extra:
      host: "0.0.0.0"
      port: 8082
      secret: "682b42ba429884e5f2385dd7d7304c42e81f21addb8d5c22e3f11aabbfedcfc2"
      routes:
        email:
          events: ["email"]
          secret: "682b42ba429884e5f2385dd7d7304c42e81f21addb8d5c22e3f11aabbfedcfc2"
          prompt: "You received an email from {sender}.\nSubject: {topic}\n\nBody:\n{content}\n\nPlease compose a thoughtful reply."
          skills: []

mcp_connections:
  - name: "cloudflare-tools"
    transport: "stdio"
    command: "npx @cloudflare/mcp-server"
    env:
      CLOUDFLARE_API_TOKEN: "${CF_API_TOKEN}"
      CLOUDFLARE_ACCOUNT_ID: "${CF_ACCOUNT_ID}"
    tool_filter:
      allow:
        - "send_email"
      deny: "*"
